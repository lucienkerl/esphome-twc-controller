name: Build generic-portal firmware

# Builds examples/generic-portal.yaml - the credential-free build described
# in the README's "Flashing without an ESPHome install" section - and
# publishes the result as a rolling GitHub Release, so anyone can download
# a ready-to-flash binary without installing ESPHome themselves.

on:
  push:
    branches: [main]
    paths:
      - "examples/generic-portal.yaml"
      - "components/**"
      - ".github/workflows/build-generic-portal.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        id: build
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: examples/generic-portal.yaml
          release-summary: >-
            Generic, credential-free build. No WiFi or MQTT settings are
            baked in - configure both from the device's own portal after
            flashing, see the README.
          release-url: https://github.com/${{ github.repository }}/blob/main/examples/generic-portal.yaml
          complete-manifest: true

      - name: Rename build output
        run: mv "${{ steps.build.outputs.name }}" output

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: generic-portal-latest
          name: Generic portal build (auto-updated)
          body: |
            Automatically rebuilt from `examples/generic-portal.yaml` on every
            push to `main` that touches it or the component itself - this is
            not a versioned release, the assets here are simply always
            current with the `main` branch.

            Flash `*.factory.bin` with any ESP32 flashing tool (esptool.py,
            ESPHome's own flasher, etc.), or use `manifest.json` with
            [ESP Web Tools](https://esphome.github.io/esp-web-tools/) for a
            browser-based flash. See the main README for what happens after
            flashing.
          files: output/*
          make_latest: false
