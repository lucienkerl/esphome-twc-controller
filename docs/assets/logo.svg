<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="TWC Gateway logo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2438"/>
      <stop offset="100%" stop-color="#091421"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ee6d0"/>
      <stop offset="100%" stop-color="#2aa8c9"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="232" height="232" rx="48" fill="url(#bg)"/>
  <rect x="4" y="4" width="232" height="232" rx="48" fill="none" stroke="#1c3a52" stroke-width="2"/>

  <!-- circuit traces, suggesting the "smart"/ESPHome side -->
  <g stroke="#2b5170" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M36 78 h26 v-18 h20"/>
    <circle cx="86" cy="60" r="4" fill="#2b5170" stroke="none"/>
    <path d="M36 162 h24 v20 h22"/>
    <circle cx="86" cy="182" r="4" fill="#2b5170" stroke="none"/>
    <path d="M204 92 h-24 v-24"/>
    <circle cx="180" cy="68" r="4" fill="#2b5170" stroke="none"/>
    <path d="M204 150 h-22 v22 h-18"/>
    <circle cx="160" cy="172" r="4" fill="#2b5170" stroke="none"/>
  </g>

  <!-- connector head: three-pin plug, abstracted -->
  <g transform="translate(120 108)">
    <circle r="52" fill="#0c1c2c" stroke="#3a6a86" stroke-width="3"/>
    <circle cx="0" cy="-22" r="9" fill="none" stroke="#7fd6ea" stroke-width="5"/>
    <circle cx="-24" cy="16" r="9" fill="none" stroke="#7fd6ea" stroke-width="5"/>
    <circle cx="24" cy="16" r="9" fill="none" stroke="#7fd6ea" stroke-width="5"/>
  </g>

  <!-- bolt, centered over the connector -->
  <path d="M132 78 L100 132 L120 132 L108 172 L150 118 L128 118 Z"
        fill="url(#bolt)" stroke="#08161f" stroke-width="2" stroke-linejoin="round"/>
</svg>
